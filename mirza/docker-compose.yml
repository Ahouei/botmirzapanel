services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mirza
      POSTGRES_USER: mirza
      POSTGRES_PASSWORD: ${MIRZA_DB__PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirza"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      MIRZA_DB__HOST: db
      MIRZA_DB__DRIVER: postgresql+asyncpg
    ports:
      - "${MIRZA_WEB__LISTEN_PORT:-8080}:8080"
    volumes:
      - ./plugins:/app/plugins:ro
    restart: unless-stopped
    command: >
      bash -c "alembic upgrade head && python -m mirza --webhook"

volumes:
  pgdata:
